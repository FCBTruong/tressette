plugins {
     id 'com.android.application'
}

def buildWithCMake = project.hasProperty('BUILD_WITH_CMAKE');
def releaseKeystoreFile = file('../../secrets/tressette-release-key.jks')
def releaseNotesFile = file('../../secrets/notes-build.txt')
def releaseStorePassword = null
def releaseKeyAlias = null

if (releaseNotesFile.exists()) {
    def notesText = releaseNotesFile.getText('UTF-8')
    def passMatch = notesText =~ /(?m)^\s*1\.\s*Pass:\s*(.+)\s*$/
    def aliasMatch = notesText =~ /(?m)^\s*2\.\s*User:\s*(.+)\s*$/
    if (passMatch.find()) {
        releaseStorePassword = passMatch.group(1).trim()
    }
    if (aliasMatch.find()) {
        releaseKeyAlias = aliasMatch.group(1).trim()
    }
}

android {
    namespace = "org.libsdl.app"
    compileSdkVersion 35
    signingConfigs {
        if (releaseKeystoreFile.exists() && releaseStorePassword && releaseKeyAlias) {
            release {
                storeFile releaseKeystoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseStorePassword
            }
        }
    }
    defaultConfig {
        applicationId "com.clareentertainment.tressette"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 58
        versionName "2.0.0"
        externalNativeBuild {
            ndkBuild {
                arguments "APP_PLATFORM=android-21"
                // abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                abiFilters 'arm64-v8a'
            }
            cmake {
                arguments "-DANDROID_PLATFORM=android-21", "-DANDROID_STL=c++_static"
                // abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                abiFilters 'arm64-v8a'
            }
        }
    }
    sourceSets.main {
        assets.srcDirs = ['../../assets']
    }
    buildTypes {
        release {
            if (signingConfigs.findByName('release') != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            if (buildWithCMake) {
                cmake {
                    path '../../CMakeLists.txt'
                }
            } else {
                ndkBuild {
                    path 'jni/Android.mk'
                }
            }
        }

    }
    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
